<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Painel | TwitteZ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-deep: #050508;
      --bg-card: #0a0a0f;
      --primary: #a855f7;
      --primary-glow: rgba(168, 85, 247, 0.4);
      --accent-pink: #ec4899;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --border-subtle: rgba(255, 255, 255, 0.05);
      --border-glow: rgba(139, 92, 246, 0.2);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background-color: var(--bg-deep);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Background glow effect */
    body::before {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.08) 0%, transparent 70%);
      top: -100px;
      left: -100px;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(236, 72, 153, 0.05) 0%, transparent 70%);
      bottom: -150px;
      right: -100px;
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 20px;
      z-index: 10;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 0 15px rgba(168, 85, 247, 0.03);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
    }

    .login-header {
      margin-bottom: 30px;
    }

    .logo {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -1px;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .logo-w {
      color: var(--primary);
      text-shadow: 0 0 12px var(--primary-glow);
    }

    .admin-badge {
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.6;
    }

    .form-group-admin {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-group-admin label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper-admin {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper-admin i {
      position: absolute;
      left: 16px;
      color: var(--text-muted);
      font-size: 16px;
    }

    .input-wrapper-admin input {
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 14px 16px 14px 44px;
      color: #fff;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .input-wrapper-admin input:focus {
      outline: none;
      border-color: var(--primary);
      background: rgba(255, 255, 255, 0.04);
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.15);
    }

    .error-banner {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #f87171;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      text-align: left;
      animation: shake 0.3s ease-in-out;
    }

    .hidden {
      display: none !important;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--primary), var(--accent-pink));
      border: none;
      border-radius: 12px;
      padding: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.45);
    }

    .btn-login:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-4px); }
      75% { transform: translateX(4px); }
    }
  </style>
</head>
<body>
  <canvas id="globe-canvas" style="position:fixed; top:0; left:0; width:100vw; height:100vh; z-index:0; pointer-events:none; opacity:0.75;"></canvas>
  <div class="login-container" style="position:relative; z-index:10;">
    <div class="login-card" style="background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(16px);">
      <div class="login-header">
        <div class="logo">
          <span class="logo-w">t</span><span>witteZ</span>
        </div>
        <p class="admin-badge">Painel de Controle</p>
      </div>

      <form id="login-form">
        <div class="form-group-admin">
          <label for="username">Usuário</label>
          <div class="input-wrapper-admin">
            <i class="fa-regular fa-user"></i>
            <input type="text" id="username" placeholder="Digite seu usuário" required autocomplete="username">
          </div>
        </div>

        <div class="form-group-admin">
          <label for="password">Senha</label>
          <div class="input-wrapper-admin">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Digite sua senha" required autocomplete="current-password">
          </div>
        </div>

        <div id="error-message" class="error-banner hidden">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="error-text">Usuário ou senha incorretos.</span>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
          <span class="btn-text">Entrar no Painel</span>
          <span class="spinner hidden"><i class="fa-solid fa-circle-notch fa-spin"></i> Entrando...</span>
        </button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Check auth status on load
      fetch('/api/auth/status')
        .then(res => res.json())
        .then(data => {
          if (data.authenticated) {
            window.location.href = 'index.html';
          }
        })
        .catch(err => console.log('Sem sessão ativa.'));

      const form = document.getElementById('login-form');
      const errorBanner = document.getElementById('error-message');
      const errorText = document.getElementById('error-text');
      const btnLogin = document.getElementById('btn-login');
      const spinner = btnLogin.querySelector('.spinner');
      const btnText = btnLogin.querySelector('.btn-text');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.classList.add('hidden');
        
        btnText.classList.add('hidden');
        spinner.classList.remove('hidden');
        btnLogin.disabled = true;

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();

        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();
          if (res.ok && data.success) {
            window.location.href = 'index.html';
          } else {
            errorText.textContent = data.message || 'Usuário ou senha incorretos.';
            errorBanner.classList.remove('hidden');
          }
        } catch (err) {
          errorText.textContent = 'Erro ao se conectar ao servidor.';
          errorBanner.classList.remove('hidden');
        } finally {
          btnText.classList.remove('hidden');
          spinner.classList.add('hidden');
          btnLogin.disabled = false;
        }
      });
    });

    // 3D Holographic Globe Background Render
    (function initGlobe() {
      const canvas = document.getElementById('globe-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const radius = Math.min(width, height) * 0.3;
      const dots = [];
      for (let i = 0; i < 550; i++) {
        const theta = Math.acos(2 * Math.random() - 1);
        const phi = 2 * Math.PI * Math.random();
        dots.push({
          baseX: radius * Math.sin(theta) * Math.cos(phi),
          baseY: radius * Math.sin(theta) * Math.sin(phi),
          baseZ: radius * Math.cos(theta),
        });
      }

      const rays = [
        { tilt: -0.3, speed: 0.008, radius: radius * 1.3, color: '#38bdf8' },
        { tilt: 0.45, speed: -0.006, radius: radius * 1.45, color: '#a855f7' },
        { tilt: 0.15, speed: 0.012, radius: radius * 1.6, color: '#ec4899' },
      ];

      let rotationY = 0;
      let rotationX = 0.2;

      function render() {
        ctx.clearRect(0, 0, width, height);
        const centerX = width * 0.5;
        const centerY = height * 0.48;

        rotationY += 0.004;

        const gradient = ctx.createRadialGradient(centerX, centerY, 20, centerX, centerY, radius * 1.9);
        gradient.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
        gradient.addColorStop(0.4, 'rgba(168, 85, 247, 0.08)');
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, width, height);

        rays.forEach((ray, idx) => {
          ctx.save();
          ctx.translate(centerX, centerY);
          ctx.rotate(ray.tilt);

          ctx.beginPath();
          ctx.ellipse(0, 0, ray.radius, ray.radius * 0.32, rotationY * (idx % 2 === 0 ? 0.3 : -0.3), 0, Math.PI * 2);
          ctx.strokeStyle = `${ray.color}44`;
          ctx.lineWidth = 1.8;
          ctx.shadowBlur = 12;
          ctx.shadowColor = ray.color;
          ctx.stroke();

          const beamAngle = rotationY * (ray.speed * 250) + idx * 2.1;
          const bx = Math.cos(beamAngle) * ray.radius;
          const by = Math.sin(beamAngle) * (ray.radius * 0.32);

          ctx.beginPath();
          ctx.arc(bx, by, 4.5, 0, Math.PI * 2);
          ctx.fillStyle = ray.color;
          ctx.shadowBlur = 20;
          ctx.shadowColor = ray.color;
          ctx.fill();

          ctx.restore();
        });

        const cosY = Math.cos(rotationY);
        const sinY = Math.sin(rotationY);
        const cosX = Math.cos(rotationX);
        const sinX = Math.sin(rotationX);

        dots.forEach((dot) => {
          let x1 = dot.baseX * cosY - dot.baseZ * sinY;
          let z1 = dot.baseX * sinY + dot.baseZ * cosY;
          let y1 = dot.baseY;

          let y2 = y1 * cosX - z1 * sinX;
          let z2 = y1 * sinX + z1 * cosX;
          let x2 = x1;

          const fov = 650;
          const scale = fov / (fov + z2);
          const px = centerX + x2 * scale;
          const py = centerY + y2 * scale;
          const alpha = Math.max(0.12, (z2 + radius) / (2 * radius));

          ctx.beginPath();
          ctx.arc(px, py, scale * 1.7, 0, Math.PI * 2);
          ctx.fillStyle = z2 > 0 ? `rgba(168, 85, 247, ${alpha * 0.9})` : `rgba(56, 189, 248, ${alpha * 0.55})`;
          if (z2 > 0) {
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#a855f7';
          }
          ctx.fill();
        });

        requestAnimationFrame(render);
      }

      render();
    })();
  </script>
</body>
</html>
